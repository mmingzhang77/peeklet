<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Peeklet: a floating photo viewer</title>
  <desc id="desc">An illustrated desktop with a small control and an abstract mountain image preview.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#173c40"/>
      <stop offset="1" stop-color="#0b2229"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a8dcce"/>
      <stop offset="1" stop-color="#f2deab"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="previewClip"><rect x="756" y="114" width="216" height="324" rx="17"/></clipPath>
  </defs>
  <rect width="1100" height="600" rx="28" fill="url(#background)"/>
  <rect x="36" y="32" width="1028" height="536" rx="22" fill="#f4f1e7"/>
  <path d="M58 32h984a22 22 0 0 1 22 22v20H36V54a22 22 0 0 1 22-22Z" fill="#e8eee6"/>
  <circle cx="61" cy="53" r="5" fill="#ee9c85"/>
  <circle cx="78" cy="53" r="5" fill="#e5c774"/>
  <circle cx="95" cy="53" r="5" fill="#7bbda5"/>
  <rect x="962" y="49" width="28" height="7" rx="3.5" fill="#6d8b84"/>
  <circle cx="1004" cy="53" r="4" fill="#6d8b84"/>
  <text x="104" y="157" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#28786c">PEEKLET</text>
  <text x="104" y="238" font-family="system-ui, sans-serif" font-size="54" font-weight="700" fill="#173c40">Your photos,</text>
  <text x="104" y="304" font-family="system-ui, sans-serif" font-size="54" font-weight="700" fill="#173c40">a touch away.</text>
  <text x="106" y="356" font-family="system-ui, sans-serif" font-size="19" fill="#57756e">A little moment, right where you work.</text>
  <rect x="106" y="401" width="179" height="42" rx="21" fill="#dcebe3"/>
  <text x="130" y="428" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#28786c">LOCAL · MACOS</text>
  <rect x="753" y="126" width="226" height="330" rx="20" fill="#0b2229" opacity="0.23" filter="url(#shadow)"/>
  <rect x="750" y="108" width="228" height="336" rx="22" fill="#172c2e"/>
  <g clip-path="url(#previewClip)">
    <rect x="756" y="114" width="216" height="324" fill="url(#sky)"/>
    <circle cx="889" cy="196" r="34" fill="#f8c77d"/>
    <path d="M756 365 823 260 864 325 901 274 972 373v65H756Z" fill="#568d80"/>
    <path d="M756 390 831 310 884 370 918 328 972 383v55H756Z" fill="#2c6e66"/>
    <path d="M756 410c56-28 95-17 134-3 31 11 56 7 82-3v34H756Z" fill="#20534f"/>
  </g>
  <rect x="996" y="251" width="36" height="36" rx="9" fill="#d6e1d9"/>
  <rect x="1008" y="267" width="12" height="3" rx="1.5" fill="#3a7b70"/>
  <path d="M739 272h-42" stroke="#8aaba0" stroke-width="2" stroke-dasharray="5 6"/>
  <text x="633" y="268" text-anchor="end" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#527b70">PRESS &amp; HOLD</text>
  <text x="633" y="290" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" fill="#78978c">Photo preview</text>
  <text x="104" y="519" font-family="system-ui, sans-serif" font-size="14" fill="#7a938a">Illustration · no photos included</text>
</svg>
